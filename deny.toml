# Configuração conferida no template oficial do cargo-deny 0.21.0.
[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
{ id = "RUSTSEC-2026-0192", reason = "ADR-017; somente manutenção, validação automática e prazo 2026-12-17" },
{ id = "RUSTSEC-2026-0440", reason = "ADR-017; somente manutenção, validação automática e prazo 2026-12-17" },
{ id = "RUSTSEC-2026-0543", reason = "ADR-017; somente manutenção, validação automática e prazo 2026-12-17" }
]

[licenses]
allow = ["MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "CDLA-Permissive-2.0", "MPL-2.0", "BSL-1.0"]
confidence-threshold = 0.95
[licenses.private]
ignore = true

[bans]
# APIs transitivas incompatíveis podem coexistir; o lock fixa cada resolução.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
