[workspace]
members = ["crates/core", "crates/config", "crates/store", "crates/normalize", "crates/collectors", "crates/cluster", "crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
repository = "https://github.com/lincolncyber-01/breaking-bytes"

[workspace.dependencies]
anyhow = "=1.0.104"
blake3 = "=1.8.7"
feed-rs = "=3.0.0"
htmlescape = "=0.3.1"
quick-xml = "=0.42.0"
regex = "=1.13.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "stream"] }
robotstxt = "=0.3.0"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
scraper = "=0.29.0"
unicode-normalization = "=0.1.26"
url = { version = "=2.5.8", features = ["serde"] }
wiremock = "=0.6.5"
axum = "=0.8.9"
chrono = { version = "=0.4.45", features = ["serde"] }
figment = { version = "=0.10.19", features = ["toml", "env"] }
http-body-util = "=0.1.5"
proptest = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
subtle = "=2.6.1"
testcontainers = "=0.28.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "process", "io-util"] }
tower = { version = "=0.5.3", features = ["util", "limit", "timeout"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }
uuid = { version = "=1.29.2", features = ["v4", "serde"] }
stories-core = { path = "crates/core" }
stories-config = { path = "crates/config" }
stories-store = { path = "crates/store" }
stories-normalize = { path = "crates/normalize" }
stories-collectors = { path = "crates/collectors" }
stories-cluster = { path = "crates/cluster" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
