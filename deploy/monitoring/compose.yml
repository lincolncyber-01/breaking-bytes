services:
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ['127.0.0.1:9090:9090']
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    environment:
      GF_SECURITY_ADMIN_USER: operations
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Defina senha exclusiva para o painel}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    volumes:
      - ./monitoring/datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./monitoring/dashboard-provider.yml:/etc/grafana/provisioning/dashboards/stories.yml:ro
      - ./monitoring/dashboard.json:/var/lib/grafana/dashboards/stories.json:ro
      - grafana-data:/var/lib/grafana
    ports: ['127.0.0.1:3000:3000']
    depends_on: [prometheus]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  prometheus-data:
  grafana-data:
