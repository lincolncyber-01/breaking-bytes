name: breaking-bytes
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    environment:
      POSTGRES_DB: stories
      POSTGRES_USER: stories
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U stories -d stories']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.50
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  migrate:
    image: breaking-bytes:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: [--migrate]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL com host postgres}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Defina ADMIN_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
  app:
    image: breaking-bytes:local
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL com host postgres}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Defina ADMIN_TOKEN}
      STORIES__ADMIN__BIND: 0.0.0.0:8080
      IG_USER_ID: ${IG_USER_ID:-}
      IG_ACCESS_TOKEN: ${IG_ACCESS_TOKEN:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      STORIES__INSTAGRAM__DRY_RUN: ${STORIES__INSTAGRAM__DRY_RUN:-true}
      LLM_API_KEY: ${LLM_API_KEY:-}
      STORIES__LLM__ENABLED: ${STORIES__LLM__ENABLED:-false}
      STORIES__COLLECTION__ENABLED: ${STORIES__COLLECTION__ENABLED:-false}
    volumes:
      - story-artifacts:/app/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:8080:8080
    healthcheck:
      test: [CMD, /app/stories-tech, --healthcheck]
      interval: 15s
      timeout: 5s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 300m
    cpus: 0.50
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  postgres-data:
  story-artifacts:
